<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:440px;height:280px;overflow:hidden;font-family:"Segoe UI",Helvetica,Arial,sans-serif}
  body{background:linear-gradient(135deg,#f6f9fd 0%,#e4edf8 100%);display:flex;align-items:center;gap:26px;padding:0 34px;box-sizing:border-box}
  img{width:120px;height:120px;flex:none;filter:drop-shadow(0 8px 14px rgba(20,60,110,.25))}
  h1{margin:0 0 8px;font-size:24px;line-height:1.15;color:#123a66;font-weight:700}
  p{margin:0;font-size:14px;line-height:1.4;color:#3d5573}
  .tag{display:inline-block;margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#159c8a}
</style></head>
<body>
  <img src="icon.svg" alt="">
  <div>
    <h1>NetSuite Dashboard Manager</h1>
    <p>Copy, export, import, back up and compare NetSuite dashboards between users, tabs and accounts.</p>
    <span class="tag">Runs inside NetSuite · no server · open source</span>
  </div>
</body></html>
