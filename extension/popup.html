<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NetSuite Dashboard Manager</title>
<style>
  body { font: 13px/1.4 "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; width: 300px; color: #1d2733; }
  header { background: #1f5a9b; color: #fff; padding: 12px 14px; font-weight: 600; }
  main { padding: 12px 14px; }
  button { display: block; width: 100%; margin: 6px 0; padding: 8px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; cursor: pointer; background: #1f5a9b; color: #fff; }
  button.secondary { background: #e8eef5; color: #1f3d5c; }
  button:disabled { opacity: .5; cursor: default; }
  p { margin: 0 0 8px; color: #4a5a6a; }
</style>
</head>
<body>
<header>NetSuite Dashboard Manager</header>
<main>
  <p id="status">Checking this tab…</p>
  <button id="open" disabled>Open panel on this dashboard</button>
  <button id="library" class="secondary">Saved dashboards &amp; tools</button>
</main>
<script src="popup.js"></script>
</body>
</html>
